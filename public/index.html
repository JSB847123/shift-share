<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>날짜별 근무표</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">공유 근무표</p>
          <h1>날짜별 근무표</h1>
        </div>
        <div class="header-actions">
          <button class="secondary-button" type="button" id="themeToggleButton" aria-pressed="false">다크모드</button>
          <button class="secondary-button" type="button" id="refreshButton">새로고침</button>
          <button class="kakao-button" type="button" id="kakaoShareButton">카카오톡 공유</button>
        </div>
      </header>

      <div class="status-area" id="statusArea" role="status" aria-live="polite"></div>

      <main class="workspace">
        <section class="panel today-panel" aria-labelledby="todayTitle">
          <div class="panel-heading">
            <h2 id="todayTitle">오늘의 근무자</h2>
            <p class="meta" id="todayDateText"></p>
          </div>
          <div id="todayShift"></div>
        </section>

        <section class="panel import-panel" aria-labelledby="importTitle">
          <div class="panel-heading">
            <h2 id="importTitle">근무자 등록</h2>
            <button class="download-button" type="button" id="templateDownloadButton">양식 다운로드</button>
          </div>

          <details class="compact-import">
            <summary>xlsx로 일괄 등록</summary>
            <form id="importForm" class="stacked-form compact-form">
              <div class="input-grid two-columns">
                <label class="field">
                  <span>등록자</span>
                  <input id="importChangedByInput" autocomplete="name" />
                </label>
                <label class="field">
                  <span>메모</span>
                  <input id="importReasonInput" autocomplete="off" value="엑셀 파일 등록" />
                </label>
              </div>

              <label class="field">
                <span>근무표 xlsx 파일</span>
                <input id="xlsxInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
              </label>

              <div class="button-row">
                <button class="primary-button" type="submit">xlsx 업로드 등록</button>
              </div>
            </form>
          </details>

          <form id="rangeFilterForm" class="range-filter-form">
            <h3>날짜별 근무자 조회</h3>
            <div class="input-grid two-columns">
              <label class="field">
                <span>시작일</span>
                <div class="date-input-wrap">
                  <input id="rangeStartInput" type="text" inputmode="numeric" autocomplete="off" placeholder="2026-05-07" />
                  <button class="date-picker-button" type="button" id="rangeStartCalendarButton" aria-label="시작일 달력 열기">
                    <span class="calendar-icon" aria-hidden="true"></span>
                  </button>
                </div>
              </label>
              <label class="field">
                <span>종료일</span>
                <div class="date-input-wrap">
                  <input id="rangeEndInput" type="text" inputmode="numeric" autocomplete="off" placeholder="2026-05-10" />
                  <button class="date-picker-button" type="button" id="rangeEndCalendarButton" aria-label="종료일 달력 열기">
                    <span class="calendar-icon" aria-hidden="true"></span>
                  </button>
                </div>
              </label>
            </div>
            <div class="button-row">
              <button class="primary-button" type="submit">기간 조회</button>
              <button class="secondary-button" type="button" id="clearRangeButton">전체 보기</button>
            </div>
            <div class="range-calendar-popover" id="rangeCalendarPopover" hidden>
              <div class="range-calendar-heading">
                <button class="secondary-button small" type="button" id="prevRangeMonthButton" aria-label="이전 달">‹</button>
                <strong id="rangeCalendarMonthLabel">2026년 5월</strong>
                <button class="secondary-button small" type="button" id="nextRangeMonthButton" aria-label="다음 달">›</button>
              </div>
              <div class="range-calendar-grid" id="rangeCalendarGrid"></div>
            </div>
          </form>
        </section>

        <section class="panel list-panel" aria-labelledby="listTitle">
          <div class="panel-heading">
            <h2 id="listTitle">날짜별 근무자</h2>
            <p class="meta" id="listMeta"></p>
          </div>
          <div id="shiftList"></div>
        </section>

        <section class="panel history-panel" aria-labelledby="historyTitle">
          <div class="panel-heading">
            <h2 id="historyTitle">최신 변경 이력</h2>
            <div class="history-heading-side">
              <p class="meta" id="selectedDateText"></p>
              <button class="danger-ghost-button small" type="button" id="undoSelectedButton">되돌리기</button>
            </div>
          </div>
          <div id="historyList"></div>
        </section>

        <section class="panel period-calendar-panel" aria-labelledby="periodCalendarTitle">
          <div class="panel-heading">
            <h2 id="periodCalendarTitle">5월 1일-6월 1일 근무 달력</h2>
            <p class="meta">날짜별 근무자</p>
          </div>
          <div id="periodCalendar"></div>
        </section>
      </main>
    </div>

    <dialog class="edit-dialog" id="editDialog">
      <form id="editForm" method="dialog" class="stacked-form">
        <div class="dialog-heading">
          <h2 id="editTitle">근무표 수정</h2>
          <button class="icon-button" type="button" id="closeEditButton" aria-label="닫기">×</button>
        </div>

        <div class="input-grid two-columns">
          <label class="field">
            <span>세무서 1</span>
            <input id="taxWorker1" autocomplete="off" />
          </label>
          <label class="field">
            <span>세무서 2</span>
            <input id="taxWorker2" autocomplete="off" />
          </label>
          <label class="field">
            <span>구청 신고창구 1</span>
            <input id="districtWorker1" autocomplete="off" />
          </label>
          <label class="field">
            <span>구청 신고창구 2</span>
            <input id="districtWorker2" autocomplete="off" />
          </label>
        </div>

        <div class="input-grid two-columns">
          <label class="field">
            <span>변경자</span>
            <input id="changedByInput" autocomplete="name" />
          </label>
          <label class="field">
            <span>메모</span>
            <input id="reasonInput" autocomplete="off" />
          </label>
        </div>

        <div class="button-row end">
          <button class="secondary-button" type="button" id="cancelEditButton">취소</button>
          <button class="primary-button" type="submit" id="saveButton">저장</button>
        </div>
      </form>
    </dialog>

    <dialog class="edit-dialog" id="undoDialog">
      <form id="undoForm" method="dialog" class="stacked-form">
        <div class="dialog-heading">
          <h2>되돌리기</h2>
          <button class="icon-button" type="button" id="closeUndoButton" aria-label="닫기">×</button>
        </div>

        <p class="dialog-copy" id="undoDateText"></p>

        <div class="input-grid two-columns">
          <label class="field">
            <span>변경자</span>
            <input id="undoChangedByInput" autocomplete="name" />
          </label>
          <label class="field">
            <span>메모</span>
            <input id="undoReasonInput" autocomplete="off" value="직전 변경 되돌리기" />
          </label>
        </div>

        <div class="button-row end">
          <button class="secondary-button" type="button" id="cancelUndoButton">취소</button>
          <button class="danger-button" type="submit">되돌리기</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
