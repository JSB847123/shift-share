<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>날짜별 근무표</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">공유 근무표</p>
          <h1>날짜별 근무표</h1>
        </div>
        <div class="header-actions">
          <button class="secondary-button" type="button" id="refreshButton">새로고침</button>
          <button class="kakao-button" type="button" id="kakaoShareButton">카카오톡 공유</button>
        </div>
      </header>

      <div class="status-area" id="statusArea" role="status" aria-live="polite"></div>

      <main class="workspace">
        <section class="panel controls-panel" aria-labelledby="controlsTitle">
          <div class="panel-heading">
            <h2 id="controlsTitle">근무표 관리</h2>
          </div>

          <div class="controls-grid">
            <label class="field">
              <span>수정할 날짜</span>
              <input id="dateInput" type="date" />
            </label>
            <label class="field">
              <span>목록 월 필터</span>
              <input id="monthInput" type="month" />
            </label>
          </div>

          <div class="button-row">
            <button class="primary-button" type="button" id="openEditButton">근무자 변경</button>
            <button class="secondary-button" type="button" id="clearMonthButton">전체 보기</button>
          </div>
        </section>

        <section class="panel list-panel" aria-labelledby="listTitle">
          <div class="panel-heading">
            <h2 id="listTitle">날짜별 근무자</h2>
            <p class="meta" id="listMeta"></p>
          </div>
          <div id="shiftList"></div>
        </section>

        <section class="panel history-panel" aria-labelledby="historyTitle">
          <div class="panel-heading">
            <h2 id="historyTitle">변경 이력</h2>
            <p class="meta" id="selectedDateText"></p>
          </div>
          <div id="historyList"></div>
        </section>
      </main>
    </div>

    <dialog class="edit-dialog" id="editDialog">
      <form id="editForm" method="dialog" class="stacked-form">
        <div class="dialog-heading">
          <h2 id="editTitle">근무자 변경</h2>
          <button class="icon-button" type="button" id="closeEditButton" aria-label="닫기">×</button>
        </div>

        <div class="input-grid two-columns">
          <label class="field">
            <span>세무서 1</span>
            <input id="taxWorker1" autocomplete="off" />
          </label>
          <label class="field">
            <span>세무서 2</span>
            <input id="taxWorker2" autocomplete="off" />
          </label>
          <label class="field">
            <span>구청 신고창구 1</span>
            <input id="districtWorker1" autocomplete="off" />
          </label>
          <label class="field">
            <span>구청 신고창구 2</span>
            <input id="districtWorker2" autocomplete="off" />
          </label>
        </div>

        <div class="input-grid two-columns">
          <label class="field">
            <span>변경자</span>
            <input id="changedByInput" autocomplete="name" />
          </label>
          <label class="field">
            <span>편집 비밀번호</span>
            <input id="editPinInput" type="password" autocomplete="current-password" />
          </label>
        </div>

        <label class="field">
          <span>메모</span>
          <input id="reasonInput" autocomplete="off" />
        </label>

        <div class="button-row end">
          <button class="secondary-button" type="button" id="cancelEditButton">취소</button>
          <button class="primary-button" type="submit" id="saveButton">저장</button>
        </div>
      </form>
    </dialog>

    <dialog class="edit-dialog" id="undoDialog">
      <form id="undoForm" method="dialog" class="stacked-form">
        <div class="dialog-heading">
          <h2>되돌리기</h2>
          <button class="icon-button" type="button" id="closeUndoButton" aria-label="닫기">×</button>
        </div>

        <p class="dialog-copy" id="undoDateText"></p>

        <div class="input-grid two-columns">
          <label class="field">
            <span>변경자</span>
            <input id="undoChangedByInput" autocomplete="name" />
          </label>
          <label class="field">
            <span>편집 비밀번호</span>
            <input id="undoEditPinInput" type="password" autocomplete="current-password" />
          </label>
        </div>

        <label class="field">
          <span>메모</span>
          <input id="undoReasonInput" autocomplete="off" value="직전 변경 되돌리기" />
        </label>

        <div class="button-row end">
          <button class="secondary-button" type="button" id="cancelUndoButton">취소</button>
          <button class="danger-button" type="submit">되돌리기</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
