<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>날짜별 근무표</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">공유 근무표</p>
          <h1>날짜별 근무표</h1>
        </div>
        <button class="secondary-button" type="button" id="refreshButton">새로고침</button>
      </header>

      <div class="status-area" id="statusArea" role="status" aria-live="polite"></div>

      <main class="workspace">
        <section class="panel calendar-panel" aria-labelledby="calendarTitle">
          <div class="panel-heading">
            <h2 id="calendarTitle">날짜 선택</h2>
            <button class="ghost-button" type="button" id="todayButton">오늘</button>
          </div>

          <label class="field">
            <span>날짜</span>
            <input id="dateInput" type="date" />
          </label>

          <label class="field">
            <span>월</span>
            <input id="monthInput" type="month" />
          </label>

          <div class="weekday-row" aria-hidden="true">
            <span>일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span>토</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <section class="panel detail-panel" aria-labelledby="detailTitle">
          <div class="panel-heading">
            <h2 id="detailTitle">근무표</h2>
            <button class="kakao-button" type="button" id="kakaoShareButton">카카오톡 공유</button>
          </div>
          <div id="shiftDetail"></div>
        </section>

        <section class="panel form-panel" aria-labelledby="formTitle">
          <div class="panel-heading">
            <h2 id="formTitle">근무표 등록</h2>
          </div>

          <form id="shiftForm" class="stacked-form">
            <div class="input-grid two-columns">
              <label class="field">
                <span>세무서 1</span>
                <input id="taxWorker1" name="taxWorker1" autocomplete="off" />
              </label>
              <label class="field">
                <span>세무서 2</span>
                <input id="taxWorker2" name="taxWorker2" autocomplete="off" />
              </label>
              <label class="field">
                <span>구청 신고창구 1</span>
                <input id="districtWorker1" name="districtWorker1" autocomplete="off" />
              </label>
              <label class="field">
                <span>구청 신고창구 2</span>
                <input id="districtWorker2" name="districtWorker2" autocomplete="off" />
              </label>
            </div>

            <div class="input-grid two-columns">
              <label class="field">
                <span>변경자</span>
                <input id="changedByInput" name="changedBy" autocomplete="name" />
              </label>
              <label class="field">
                <span>편집 비밀번호</span>
                <input id="editPinInput" name="editPin" type="password" autocomplete="current-password" />
              </label>
            </div>

            <label class="field">
              <span>메모</span>
              <input id="reasonInput" name="reason" autocomplete="off" />
            </label>

            <div class="button-row">
              <button class="primary-button" type="submit" id="saveButton">저장</button>
              <button class="secondary-button" type="button" id="openReplaceButton">근무자 교체</button>
            </div>
          </form>
        </section>

        <section class="panel swap-panel" aria-labelledby="swapTitle">
          <div class="panel-heading">
            <h2 id="swapTitle">근무자 맞바꾸기</h2>
          </div>

          <form id="swapForm" class="stacked-form">
            <div class="input-grid two-columns">
              <label class="field">
                <span>근무자 A</span>
                <select id="swapASelect"></select>
              </label>
              <label class="field">
                <span>근무자 B</span>
                <select id="swapBSelect"></select>
              </label>
              <label class="field">
                <span>변경자</span>
                <input id="swapChangedByInput" autocomplete="name" />
              </label>
              <label class="field">
                <span>편집 비밀번호</span>
                <input id="swapEditPinInput" type="password" autocomplete="current-password" />
              </label>
            </div>
            <label class="field">
              <span>메모</span>
              <input id="swapReasonInput" autocomplete="off" />
            </label>
            <div class="button-row">
              <button class="primary-button" type="submit">맞바꾸기</button>
            </div>
          </form>
        </section>

        <section class="panel history-panel" aria-labelledby="historyTitle">
          <div class="panel-heading">
            <h2 id="historyTitle">변경 이력</h2>
          </div>
          <div id="historyList"></div>
        </section>
      </main>
    </div>

    <dialog class="replace-dialog" id="replaceDialog">
      <form id="replaceForm" method="dialog" class="stacked-form">
        <div class="panel-heading">
          <h2>근무자 교체</h2>
          <button class="icon-button" type="button" id="closeReplaceButton" aria-label="닫기">×</button>
        </div>

        <label class="field">
          <span>현재 근무자</span>
          <select id="replacePositionSelect"></select>
        </label>

        <label class="field">
          <span>새 근무자</span>
          <input id="replaceWorkerInput" autocomplete="off" />
        </label>

        <div class="input-grid two-columns">
          <label class="field">
            <span>변경자</span>
            <input id="replaceChangedByInput" autocomplete="name" />
          </label>
          <label class="field">
            <span>편집 비밀번호</span>
            <input id="replaceEditPinInput" type="password" autocomplete="current-password" />
          </label>
        </div>

        <label class="field">
          <span>메모</span>
          <input id="replaceReasonInput" autocomplete="off" />
        </label>

        <div class="button-row end">
          <button class="secondary-button" type="button" id="cancelReplaceButton">취소</button>
          <button class="primary-button" type="submit">교체</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
